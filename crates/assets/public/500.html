<!DOCTYPE html>
<html lang="en">
<head>
  <title>Something went wrong (500)</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f5; --card: #fff; --ink: #18181b; --muted: #71717b; --border: #e4e4e7; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --card: #18181b; --ink: #fafafa; --muted: #a1a1aa; --border: #27272a; --accent: #3b82f6; } }
    * { box-sizing: border-box; }
    body { display: grid; place-items: center; min-height: 100dvh; margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { width: min(440px, 100%); padding: 32px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); text-align: center; }
    .code { margin: 0; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.06em; }
    h1 { margin: 6px 0 8px; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    p { margin: 0 0 22px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    a { display: inline-block; padding: 10px 18px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p class="code">ERROR 500</p>
    <h1>Something went wrong</h1>
    <p>That's our fault, not yours. Try again in a moment.</p>
    <a href="/">Back to Campfire</a>
  </main>
</body>
</html>
