<h1 class="ws-settings__title">{% if bot.name.is_some() %}Edit bot{% else %}Add a bot{% endif %}</h1>
<div class="ws-profile">
  <label class="ws-profile__photo" data-controller="upload-preview">
    <span class="ws-field__label">Picture</span>
    {{ h::image_tag(ctx, bot.avatar_attachment_url.as_deref().unwrap_or("default-bot-avatar.svg"), h::attrs().class("ws-profile__image ws-profile__image--small").alt("Bot avatar").size(96).data("upload_preview_target", "image")) }}
    <span class="ws-btn ws-btn--block input--file">
      Upload picture
      {{ form.file_field("avatar", h::attrs().class("input").accept("image/*").data("upload_preview_target", "input").data("action", "upload-preview#previewImage")) }}
    </span>
  </label>

  <div class="ws-profile__fields">
    <label class="ws-field">
      <span class="ws-field__label">Name</span>
      {{ form.text_field("name", bot.name.as_deref(), h::attrs().class("ws-input").autocomplete("name").placeholder("e.g. Deploys").autofocus().required(true).data("1p-ignore", true)) }}
    </label>

    <label class="ws-field">
      <span class="ws-field__label">Webhook URL <span class="ws-hint">(optional)</span></span>
      {{ form.url_field("webhook_url", bot.webhook_url.as_deref(), h::attrs().class("ws-input").placeholder("https://…")) }}
      <span class="ws-hint">Messages that @mention the bot, or are sent to it directly, are posted here; its reply goes back to the channel.</span>
    </label>

    <div class="ws-actions">
      <button type="submit" class="ws-btn ws-btn--primary">Save</button>
    </div>
  </div>
</div>
