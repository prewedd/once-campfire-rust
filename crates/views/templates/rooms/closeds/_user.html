{#- reference/app/views/rooms/closeds/_user.html.erb -#}
<li class="ws-row" data-value="{{ user.name.to_lowercase() }}">
  {%- if form.can_administer && !(user.id == form.current_user_id && form.room.id.is_none()) %}
  <label class="ws-row__main ws-row__check">
    <input type="checkbox" name="user_ids[]" value="{{ user.id }}"{% if selected %} checked="checked"{% endif %} />
    <img class="ws-row__avatar" aria-hidden="true" loading="lazy" src="{{ user.avatar_url }}" width="32" height="32" />
    <span class="ws-row__name">{{ user.name }}</span>
  </label>
  {%- else %}
  <span class="ws-row__main ws-row__check">
    {%- if form.can_administer %}<input type="hidden" name="user_ids[]" value="{{ user.id }}" /><input type="checkbox" checked disabled aria-label="You" />{% endif %}
    <img class="ws-row__avatar" aria-hidden="true" loading="lazy" src="{{ user.avatar_url }}" width="32" height="32" />
    <span class="ws-row__name">{{ user.name }}{% if user.id == form.current_user_id %} <span class="ws-row__you">(you)</span>{% endif %}</span>
  </span>
  {%- endif %}
</li>
