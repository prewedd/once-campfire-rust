# html5ever 0.35.0 from crates.io, with one fix backported from 0.39: reconstruct the active
# formatting elements before inserting <svg> or <math> in body, as the HTML spec (and Gumbo, which
# Nokogiri uses) does. Later releases also adopt the customizable-<select> parsing rules, which
# Gumbo doesn't, so upgrading isn't an option. See crates/richtext/src/dom.rs.
#
# Two additions of ours let dom.rs hold a parse to Gumbo's limits while it runs, not after the
# whole tree is built, which takes quadratic time for hostile input:
# - `TreeBuilder::open_elements_len`, a read accessor on the stack of open elements, which Gumbo
#   checks against its tree depth limit before each token.
# - `TokenizerOpts::max_attributes` and `Tokenizer::too_many_attributes`: starting an attribute on a
#   tag that already has `max_attributes` sets the flag, and attributes past the limit are dropped
#   without the duplicate scan (quadratic in a tag's attributes), as Gumbo's tokenizer does.
#
# rustfmt.toml is ours too: it keeps `cargo fmt --all` off upstream's code.
[package]
edition = "2021"
name = "html5ever"
version = "0.35.0"
license = "MIT OR Apache-2.0"
publish = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[dependencies]
log = "0.4"
markup5ever = "0.35.0"
match_token = "0.35.0"

[features]
trace_tokenizer = []

# Upstream's code, not ours: keep clippy's opinions of it out of the workspace's lint run.
[lints.clippy]
all = "allow"
